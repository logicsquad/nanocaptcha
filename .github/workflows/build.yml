name: build
on:
  push:
    branches:
      - develop
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 8
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
